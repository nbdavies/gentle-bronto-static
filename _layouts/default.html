<!DOCTYPE html>
<html>
  <head>
    <title>Gentle Brontosaurus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="css/bootstrap-default-themed.css" /> -->
    <link rel="stylesheet" href="css/application.css" />
    <link rel="shortcut icon" type="image/x-icon" href="/images/favicon.ico">
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg">
        <div class='container-fluid'>
          <div class="row">
            <div class="col-xl-4 col-md-6 pt-2 pb-2">
              <a class="navbar-brand" href="#">
                <div id='logo' style="display: inline-block;">
                  <img src='images/gb_logo.png' alt='Logo' class='img-fluid' style='border-radius: 100%; border: 2px solid #C3D767; background-color: #F9F2D1; max-height: 3em;' />
                </div>
                <h3 style="display:inline-block;">Gentle Brontosaurus</h3>
              </a>
            </div>
            <div class="col-xl-4 col-md-6 pt-2 pb-2">
              <div class='row'>
                <div class="col">
                  <a class='svg' href="https://gentlebrontosaurus.bandcamp.com">
                    <img src='images/bandcamp.svg' />
                  </a>
                </div>
                <div class="col">
                  <a class='svg' href="https://www.facebook.com/GentleBrontosaurus/">
                    <img src='images/facebook.svg' />
                  </a>
                </div>
                <div class="col">
                  <a class='svg' href="https://instagram.com/gentlebrontosaurus">
                    <img src='images/instagram.svg' />
                  </a>
                </div>
                <div class="col">
                  <a class='svg' href="https://soundcloud.com/gentle-brontosaurus">
                    <img src='images/soundcloud.svg'>
                  </a>
                </div>
                <div class="col">
                  <a class='svg' href="https://www.youtube.com/channel/UCUuQVacYk3FdPHuDn2pq9Ag">
                    <img src='images/youtube.svg' />
                  </a>
                </div>
              </div>
            </div>
            <div class="col-xl-4 col-md-12 align-items-end pt-2 pb-2">
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class='navbar-nav'>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'news' %}active{% endif %}' href="/news">News</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'shows' %}active{% endif %}' href="/shows">Shows</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'music' %}active{% endif %}' href="/music">Music</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'about' %}active{% endif %}' href="/about">About</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'history' %}active{% endif %}' href="/history">History</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'press' %}active{% endif %}' href="/press">Press</a>
                  </li>
                  <li class='nav-item'>
                    <a class='nav-link {% if page.nav == 'friends' %}active{% endif %}' href="/friends">Friends</a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <main class='container'>
        <div class='row'>
          <div class='col-12'>
            {{ content }}
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
